<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Hellen 💌</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
        overflow: hidden;
        position: relative;
    }
    .card {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 24px;
        padding: 50px 40px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(200, 60, 120, 0.35);
        max-width: 480px;
        width: 90%;
        z-index: 2;
        animation: pop 0.6s ease;
    }
    @keyframes pop {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
    }
    h1 {
        font-size: 1.6rem;
        color: #d6336c;
        margin-bottom: 14px;
    }
    p { color: #7a4a5e; margin-bottom: 30px; font-size: 1.05rem; }
    .buttons { display: flex; gap: 20px; justify-content: center; position: relative; min-height: 80px; }
    button {
        font-size: 1.1rem;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        padding: 14px 40px;
        cursor: pointer;
        transition: transform 0.15s;
    }
    #yesBtn {
        background: linear-gradient(135deg, #ff4d6d, #ff758f);
        color: white;
        box-shadow: 0 8px 20px rgba(255, 77, 109, 0.45);
    }
    #yesBtn:hover { transform: scale(1.1); }
    #noBtn {
        background: #e9ecef;
        color: #6c757d;
        position: absolute;   /* so we can move it anywhere on screen */
        z-index: 3;
    }
    .hearts span {
        position: absolute;
        bottom: -30px;
        color: rgba(255, 255, 255, 0.7);
        animation: float 6s linear infinite;
        pointer-events: none;
        font-size: 20px;
    }
    @keyframes float {
        0%   { transform: translateY(0) rotate(0deg); opacity: 0.8; }
        100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    #celebration {
        display: none;
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #ff4d6d, #ff758f);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: white;
        text-align: center;
        z-index: 10;
    }
    #celebration h2 { font-size: 2.5rem; margin-bottom: 12px; }
    #celebration p  { font-size: 1.3rem; color: #ffe3ec; }
    .big-heart { font-size: 4rem; animation: beat 1s infinite; }
    @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }
</style>
<base target="_blank">
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="card">
    <h1>Dear Hellen 💕</h1>
    <p>Will you go out on a date with me?</p>
    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<div id="celebration">
    <div class="big-heart">❤️</div>
    <h2>Yayyy! 🎉</h2>
    <p>See you on our date, Hellen! 😍</p>
</div>

<script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const celebration = document.getElementById('celebration');
    const taunts = ['No', 'Nope 😜', 'Try again!', 'Catch me!', 'Nah 😝', 'Not today!', 'Missed me!'];
    let tauntIndex = 0;
    let dodges = 0;

    function moveNoButton() {
        // Move the No button to a random position anywhere on the screen
        const pad = 10;
        const maxX = window.innerWidth - noBtn.offsetWidth - pad;
        const maxY = window.innerHeight - noBtn.offsetHeight - pad;
        const x = Math.max(pad, Math.random() * maxX);
        const y = Math.max(pad, Math.random() * maxY);
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';

        // Tease a little after a few dodges
        dodges++;
        if (dodges >= 3) {
            noBtn.textContent = taunts[tauntIndex % taunts.length];
            tauntIndex++;
        }
        // Shrink No slightly, grow Yes — so "Yes" becomes irresistible
        const scale = Math.max(0.6, 1 - dodges * 0.05);
        noBtn.style.transform = 'scale(' + scale + ')';
        yesBtn.style.transform = 'scale(' + (1 + dodges * 0.04) + ')';
    }

    // Flee on hover AND on any touch/click attempt
    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); });
    noBtn.addEventListener('click', (e) => { e.preventDefault(); moveNoButton(); });

    yesBtn.addEventListener('click', () => {
        celebration.style.display = 'flex';
    });

    // Floating background hearts
    const heartsContainer = document.getElementById('hearts');
    for (let i = 0; i < 20; i++) {
        const s = document.createElement('span');
        s.textContent = '❤';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.animationDelay = (Math.random() * 6) + 's';
        s.style.animationDuration = (4 + Math.random() * 4) + 's';
        s.style.fontSize = (12 + Math.random() * 20) + 'px';
        heartsContainer.appendChild(s);
    }
</script>

</body>
</html>
